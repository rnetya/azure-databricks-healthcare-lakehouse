
# M1.11 — Local development configuration

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Databricks notebook globals provided at runtime.
[tool.ruff.lint.per-file-ignores]
"src/notebooks/**/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff.format]
exclude = ["src/notebooks/foundation/*.py"]
